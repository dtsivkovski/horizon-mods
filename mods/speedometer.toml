id = "speedometer"
kind = "mod"
name = "Speedometer"
summary = "How fast you move, in a corner of the screen: blocks per second or km/h, walking, riding, boating or flying."
description = """
Your speed over the last second, in a corner of the screen.

- Measured from where you were each client tick, so walking, sprinting, riding, boats and elytra flight all count.
- Blocks per second (a block is a metre) or km/h.
- Across the ground by default. Turn on "Count climbing and falling" to count height changes too, as in a fall or an elytra dive.
- Gives way to the debug screen (F3) in its corner.
- Settings: Options > Mods > Speedometer (shown, corner, unit, climbing and falling).

It reads only your own position and draws on the HUD: nothing else. A WebAssembly mod for Horizon's mod API 0.2, client-side.
Source and build pipeline: [abuzar310/horizon-mod-ports](https://github.com/abuzar310/horizon-mod-ports/tree/main/mods/speedometer).
"""
