file = "dimstorage.hmod"
sha256 = "74a967bc259bf53c4478a15a235534ee7af1e27f9c785a4e1065ed5a107af77f"
changelog = """This version closes the last way the tank could lose a bucket. At the world's channel limit a new frequency was reported as having room, so the bucket handler accepted the transfer, the store refused to admit the channel, and the tank was then overwritten with the store's empty balance. Now a channel the store cannot admit reports no room at all, a refused write keeps the tank's own fluid and is never reported as committed, and the player is told why — which needed a third fix found in game, because a command's own answer is dropped during a block click, so the refusal had been silent. Proven on a world grown to exactly its limit: the bucket is untouched, the tank still reads its old contents, the neighbouring channel still holds what it held, and the new frequency never appears in the store, while the same click on a known channel lands as usual."""

[[versions]]
version = "0.2.4"
published = "2026-11-23"
game = "26.3"
file = "dimstorage.hmod"
sha256 = "02cc3b1c937686ba6a4e8f1929ca470f6d91fe5cecdc597fbd20c58a5b6333ed"
changelog = """This version answers a review of the dimensional tank, and the review found a real hazard in a shared fluid store. A bucket transfer now commits to the channel before it reports success, so a sibling tank reading in the same tick sees the change, and removing a tank before its next tick cannot lose a finished transfer. A channel that has been drained stays drained: the world remembers which channels it knows, so a stale tank left behind cannot re-seed one after a restart, which the game leg proves by removing a sibling with ticks frozen, relaunching, and reading the same amount. A fill that cannot fit is refused whole, before anything lands, rather than accepted and then clamped away by the next sync. One limit is stated rather than papered over: a foreign capability write through a pipe arrives inside the game's own transaction, which cannot roll back a store outside it, so it is staged in the tank's own saved compound and committed at the next tick, break or reload. The four regression cases the review named were written first and each failed against the previous model for the reason the review gave.
"""

