changelog = "Reads the local player's entity id once per frame instead of resolving every cached mob, removing a quadratic mob-list scan in crowded multiplayer scenes. Otherwise identical to 0.1.3: overlapping lights are balanced towards the brightest source, the enchanted halo fades beside brighter frames and drops, and weak halos cannot take a slot at the eight-light cap. Same Nov 21 Nightly pin (Horizon f037744)."
