sha256 = "6df52b7421749bc7fea622dd3359e84ce3ff847ea2454d2ce9ef3ef79c2d15f5"
changelog = """Slice 2, the power monitor: a block that reads the machine behind it every twenty ticks and shows how full it is, as a level state and as redstone, so a generator's charge is finally visible from outside. The ratio is the reference's own, one plus five steps of charge, and the bands are settable the way its GUI would set them. Proven in game across three readings and two controls: a generator at half its buffer reads level three, an empty one reads level one, and plain stone reads level zero because it is not an energy block; a band of forty to sixty lights the lamp at fifty percent and a band of ninety to a hundred puts it out; and the generator's own push, which this slice also adds, empties a hundred thousand FE into an adjacent receiver in two-thousand-FE steps while the monitor facing that receiver reads full. One limit is stated rather than papered over: a monitor has no buffer of its own in the reference, so the push is proven against a receiver that exists only in the test harness, and the delivered package invents no buffer to make the assertion easier."""

