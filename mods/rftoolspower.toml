[[versions]]
version = "0.1.7"
published = "2026-11-23"
game = "26.3"
file = "rftoolspower.hmod"
sha256 = "15cc6d27279638fb67003d7a9492eb8dd21f87b1273025a433c4712121212bbd"
changelog = """This version adds the blazing agitator, the machine that makes a rod better by standing it beside other rods. The reference's arithmetic is unusual and it is followed exactly: each rod's quality factor comes from its own quality and duration, each neighbour contributes the difference between its factor and its own, the sum is floored at one and divided by four, and that figure then drives time down and quality and duration up, so a full box beats a lone rod and the middle of a row beats its ends. Proven in game on the arithmetic rather than on a trend: the store falls exactly ten a tick over forty-seven ticks, the combined change across the whole box matches the machine's own readout to six decimal places, a lone rod rises at its own much smaller rate, a neighbour feeding it gains and loses exactly in step, outputs move in order, locks hold, a plain blaze rod converts, and an agitated rod leaves in a hopper. One defect only the game could show is fixed: a number stored as a double was read as a float, so a rod whose time read five hundredths came back as four and a half quintillion ticks. Two corrections from the artefact are recorded: a lone rod's factor is not one but a fifth, and the infuser's counter period is eleven ticks rather than ten."""

[[versions]]
version = "0.1.6"
published = "2026-11-23"
game = "26.3"
file = "rftoolspower.hmod"
sha256 = "7fe0e23708d8473564c53494f983c01bb9373fafdb8d551f7b8db5df0ae59a7c"
changelog = """This version carries the blazing generator and the blazing rod, whose whole mechanic is a number in the rod's own item data: a rod starts at six units of energy a tick, climbs toward sixty over more than five hundred ticks, and decays once it leaves the slot. The ramp is proved by its own fold rather than by a rate: six point nine becomes seventeen point two over thirty-one ticks and the closed form predicts it to five decimal places. At sixty the generator makes exactly sixty a tick, a rod inserted into a full buffer takes it to exactly a million and is still burning, a hundred thousand is handed to a receiver in the same tick with nothing kept back, and a rod plus a generator both survive a relaunch. The component is a real registered type read from the delivered stack, not a lore string, and the in-game check reads it back with the generator consuming the same value. Two brief assertions were wrong and the artefact won: the four-hundred-tick rod never reaches its ceiling, and the block's click is owned by the global hook rather than the part, measured twice against two different templates.
"""

[[versions]]
version = "0.1.5"
published = "2026-11-23"
game = "26.3"
file = "rftoolspower.hmod"
sha256 = "26485b9a8e5277bc248ad4a476e17b98cdcd3a1632e4718bb44d0b8909b614d6"
changelog = """Slice 6, the power level display: a block that writes a redstone strength onto the face it displays on, in ten steps from empty to full. The brief's arithmetic was wrong and the artefact won: the reference multiplies by ten and divides, so a generator at half of its capacity reads five, not four, and the game leg pins five while the counterfactual keeps a deliberate four so the assertion can fail. Proven in game on all three readings plus a differential: empty reads zero, half reads five with a wire on the display face and nothing on the wrong face, and full reads nine because ten clamps. The block also answers a query at a position where there is no display, and its recipe refuses to craft with a wrong ingredient. The reference has the same face bug this family's other machine had — it answers redstone on one side and notifies another — so the port answers and notifies on the face it shows on.
"""

[[versions]]
version = "0.1.4"
published = "2026-11-23"
game = "26.3"
file = "rftoolspower.hmod"
sha256 = "e1c6015697ba7825e07e6b58f0ca25daa89c7617c6880a90af4fec6968b1c9b2"
changelog = """Slice 4, the ender monitor: the block that watches a pearl's journey and answers a redstone signal for exactly one tick, in one of three modes — the pearl lost, fired, or arrived. Proving a one-tick pulse needs a sample rather than a look, so the game leg samples sixteen consecutive server ticks around the landing and records the string, where the arrived monitor lights in exactly one of them and the same shot with the mode set to lost lights in none while still paying its energy; that pairing is the differential that makes the first claim mean something. Three further cases come with it: two notices inside one tick produce one pulse, a mis-facing monitor stays dark, and a survival break drops an item carrying the mode, which reads back after being placed again. One defect in the reference is fixed rather than copied: the generator answers its redstone through one face and notifies its display through another, so a lamp beside the monitor would never light; this port answers and notifies on the face it displays on.
"""

