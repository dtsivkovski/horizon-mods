id = "clumps"
kind = "mod"
name = "Clumps"
summary = "Clumps XP orbs together."
description = """
A Horizon WebAssembly port of [Clumps](https://github.com/jaredlll08/Clumps) by Jaredlll08 (MIT License).

- Merges nearby experience orbs regardless of their XP value or entity ID (`experience_orb_can_merge`).
- Combines exact XP totals into representable `(value, count)` pairs without transient state or XP loss, canceling merges when no exact representation exists and treating negative denominations as zero XP (`experience_orb_merge`).
- Collapses multi-count orbs on pickup when representable in `i32` and removes the XP pickup cooldown (`set_exp_cooldown(0)`) (`pickup_xp`).

Original mod: https://github.com/jaredlll08/Clumps (Jaredlll08, MIT License).
"""
authors = ["Jaredlll08", "GoldenRose01"]
