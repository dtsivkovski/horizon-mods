changelog = "Registered under its own id, occultism_horizon, because occultism is taken: id, namespaces = [\"occultism\"] (files, in-game ids and saved worlds are unchanged) and [incompatible] with occultism; remove any installed occultism first. Security fixes from the registry review: store ids read from items and worlds are accepted only in the mod's own form, so a forged one can't make a save write outside the world, and a soul gem's work area only at its real sizes, so a forged one can't stall the server."

