changelog = "Much more of Occultism. Added: weather and time magic; otherstone, otherrock and gambler traders; the wild hordes, Wild Hunt, illager invasion and trial breezes; random-animal possessions and resurrections; flaming paste; silver and infused tools and armour, the butcher knives and their drops; large candles, golden pitayas, otherglass, the otherflower, otherrock and silver building blocks; copper, silver, dark and iesnium bowls (iesnium runs rituals four times as fast); the spirit lantern and torch; ritual particles and chalk-coloured spirit fire. Security, from the registry review: flaming paste no longer sets fire or pours lava beside the block it is used on, throws fireballs or primes TNT, and the spirit torch isn't put on walls, as none of these could go through the server's own checks (spawn protection, the world border, TNT's priming) at this SDK pin. Same id, namespace and saved worlds as 0.11.2-alpha.1."
