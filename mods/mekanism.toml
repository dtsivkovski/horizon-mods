changelog = """Slice 5, the chemical injection chamber: the consumer half of the capability slice 4 published, so a machine now pulls gas out of a neighbour's tank through the key on its tick and turns ore into shards with it. Two numbers were read from the artefact rather than assumed: the raw iron row wants hydrogen chloride and not hydrogen, which makes hydrogen a useful wrong-gas control, and this machine costs four hundred FE a tick rather than the fifty of its siblings, so an operation is eighty thousand, and the cell draws one tick's gas two hundred times, so a whole operation empties two hundred times the per-tick amount. Proven in game with three counterfactuals in the same run: a tank of four thousand hydrogen chloride turns three raw iron into eight shards and ends at three thousand eight hundred, which is exactly two hundred times the row's per-tick; with no tank beside it the chamber sits at zero progress with its energy untouched; a tank of oxygen behaves the same; and a hydrogen tank is left alone. All seventy-two carried rows ran, and each drew exactly its own per-tick amount from the tank, which is the assertion that would fail if the pull were inert. The limit found in slice 4 holds and is recorded rather than worked around: the provider and the consumer here are the same crate's tank and chemical type, which is why this draw resolves."""

