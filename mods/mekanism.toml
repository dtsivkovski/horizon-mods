changelog = """Slice 6, the purification chamber: the middle of the ore chain, where a raw ore and oxygen become three clumps. It is the same machine shape as the injection chamber but its numbers are its own, read rather than carried over: two hundred FE a tick rather than four hundred, eighty thousand of buffer, and a whole operation is forty thousand. Proven in game with three counterfactuals in one run: four thousand oxygen in a tank turns one iron ore into three clumps for exactly forty thousand FE and leaves the tank at three thousand eight hundred, which is the per-tick draw times two hundred; with no tank beside it the chamber sits full and the ore untouched; with a hydrogen chloride tank, which is the injection chamber's gas, nothing moves and the tank is untouched. The chain is proved end to end as the data declares it rather than as our brief guessed: the clump crushes to a dirty dust and the dirty dust enriches to a dust in the enrichment chamber, while this chamber given a dirty dust sits at eighty thousand FE with an untouched input, which is the counterfactual that proves the two machines are not interchangeable. Fifteen purification rows ran, and the crusher and injecting sweeps still pass at a hundred and forty-eight and seventy-two."""

