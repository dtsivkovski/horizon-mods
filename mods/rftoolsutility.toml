changelog = """Slice 4, the spawner: a machine that sets a mob and spawns it on the neighbour its facing names, at the cost the mob's own recipe declares, with the mob chosen by a data recipe rather than a menu. The jar ships seventy such recipes, not the hundred our notes guessed, and all seventy travel byte for byte, because they carry the ingredient lists in a form this port deliberately never parses. Proven in game with the counterfactual on the same machine: with no energy it spawns nothing across sixty ticks and its counter stays at zero, and with the eight hundred its zombie recipe costs it spawns exactly one zombie within five blocks and leaves nothing in the buffer; a blaze costs a thousand and sets the second spawn's offsets. An absent mob is refused with the recipe count named, and an unknown id is refused before any energy is spent. That last point is a defect this port does not reproduce: upstream consumes the energy and clears the matter amounts before it checks whether the mob exists, so a recipe for an absent entity costs everything for a spawn that never happens. This port pays only once the spawn has answered."""
