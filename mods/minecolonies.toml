changelog = """Slice 3, the two job buildings: a lumberjack's hut and a mine, so the two jobs added last time now have the building their own rule expects, and a citizen cannot be assigned a job whose building is missing. One marker type names the building, which is what lets one query answer for every job instead of special-casing the farmer. Proven in game with the refusal as the boundary: assigning a lumberjack with no hut is refused with a message naming the block and the colony, the same citizen then leaves a whole four-log tree standing over two hundred ticks, and with the hut placed the same tree falls to four logs in the chest with a sapling left on the stump; job info reads the hut present, and after the hut is broken in survival with an iron axe, which is needed because a creative break drops nothing, the drop is the hut itself and job info reads missing. The mine works the same way for the miner, whose shaft is one by one and eight deep with the bedrock untouched. Both recipes craft with their ingredients consumed and a wrong grid crafts nothing. The licence half is measured rather than asserted: all twenty-five asset files were hashed against all twenty-two thousand seven hundred and forty-seven entries in the jar, and none matched, with the generator re-rendering every one byte-identically."""

