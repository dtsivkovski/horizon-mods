description = "Enable this companion resource pack alongside the Ender Undertow beta world data pack for the encounter sounds and wardrobe.\n\n**Installing Ender Undertow on Horizon 26.3**\n\n- [Ender Undertow](https://playhorizon.dev/mods/ender_undertow) — World data pack for the mining and teleport encounter. It works on its own.\n- [Cinematic](https://playhorizon.dev/mods/ender_undertow_cinematic) — Native mod for the camera turn, lowered hands and color fade. Install on the host and each participating client, then opt in with `/trigger eu.scene set 1`.\n- **Resources** (this listing) — Client resource pack for the Gentleman’s voice and wardrobe and the lingering portal sound. Enable it in Resource Packs.\n- [Focus](https://playhorizon.dev/mods/ender_undertow_focus) — Optional client shader for blur and warble during the cinematic. Select it in Shader Packs.\n\n[Download all four in one ZIP and see installation instructions](https://michado.dk/projects/ender-undertow/#install)."
