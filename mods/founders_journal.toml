id = "founders_journal"
kind = "datapack"
name = "Chapterloom: Founders"
summary = "Optional settlement quests for Horizon 26.3. Recipes stay available unless a modpack author adds a quest requirement."
description = """
You can play Founders at your own pace. The chapter leaves your crafting recipes available even if you skip every quest.

Start a settlement and follow its progress from a crafting table to tools, a hearth and fields. Obtain a crafting table to complete Set Up Camp and earn 10 XP.

This download installs the Founders chapter data in your world. For the book and its Claim reward button, build the [matching Chapterloom runtime](https://github.com/Fnux8890/chapterloom/tree/v1.1.2-beta.1#build-the-beta-runtime). Press L to open it. Single-player works offline after setup. Multiplayer uses the same patched build on the host and clients.

Modpack authors can choose which recipes require a completed quest. The second screenshot shows the Expert example, where completing Set Up Camp unlocks the blast furnace. Players can claim their reward later. [See the crafting rule and how to add it to a modpack](https://github.com/Fnux8890/chapterloom/blob/v1.1.2-beta.1/docs/quest-gated-crafting.md).
"""
