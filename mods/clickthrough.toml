id = "clickthrough"
kind = "mod"
name = "ClickThrough"
summary = "Use containers through attached wall signs and banners. Hold Sneak to use the marker itself."
description = """
Right-click a wall sign, wall hanging sign, or wall banner attached to a supported container to use the container directly. Hold your Sneak key while right-clicking to use the marker normally. Supported containers include chests, barrels, shulker boxes, hoppers, dispensers, droppers, furnaces, brewing stands, ender chests, and crafters.

This version always targets containers. It has no settings screen. Only Survival and Creative players are redirected; spectators and adventure players keep vanilla behavior. Item frames keep vanilla behavior: the entity hook carries no player handle, so the destination ray the container requires cannot be built there.

Sandboxed WebAssembly mod: install it on the launcher's Mods page. It runs in the game's sandbox with no compiler needed on your machine, in single-player and on servers.

A Horizon port of [ClickThrough](https://github.com/gbl/ClickThrough) by Giselbaer (Guntram Blohm), MIT licensed."""
