changelog = """This version answers a review with a behaviour reduction, deliberately and with the evidence for it. The gadget's area modes wrote blocks through a raw path, so a protection mod could not cancel a single placement, and the only calls this pin offers that take an actor either bypass protection by their own contract or require a fake player a mod cannot create. So the modes are held rather than written: a click plans the cells, reports how many would be allowed and how many were placed, spends nothing, and says which symbol is missing. Selection, all eight mode plans, ranges and the wheel keep working, and the hold lifts with one constant when the pin gains a cancellable placement call. The second review item is fixed and measured: the upper world-border bound is now exclusive, which the game proves by counting nineteen allowed cells when the clicked column lies exactly on the bound and twenty-four when it is one cell inside. The old assertion that encoded the defect was corrected with it, and the pre-fix mode logs are retired so no stale pass claims a build that no longer happens.
"""

