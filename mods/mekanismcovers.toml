changelog = """
This version applies the same rule to the other path a cover can be consumed by. A cover renamed in an anvil carries a component besides its block, and clicking it onto a transmitter used to store only the block, so the name was gone when the cover came back off. The click now refuses such a cover exactly as the crafting grid refuses a stack with components, through the same predicate, and the cover stays in hand with nothing written. Proven in game beside the plain case: a named cover clicked on a cable leaves the transmitter wearing nothing and the cover in the inventory, while a plain cover in the same session writes its block. Three harness faults the legs forced are fixed and recorded: an item given lands in the first free hotbar slot rather than the first, a spawned drop can miss its first sample, and the game's folder is the launching command's working directory, which had been writing worlds into the campaign root instead of the run's scratch directory.
"""
