changelog = """Slice 2, the datura crop and its seed source: before this the seed was creative-only, so the mod's own first step, the spirit fire loop, was unreachable in survival. A wheat-shaped crop that grows through eight ages, harvests ripe into one datura and three seeds while a young one gives a single seed, and replants itself at age zero; plus the jar's two seed modifiers on short and tall grass, two percent by hand and inverted on shears. Proven in game across four legs: the eight ages read back, a planted crop advanced from age zero to age seven under random ticks, a ripe crop dropped one fruit and three seeds while a young one dropped only a seed, and twenty-five hand breaks landed three seeds where twenty-five shear breaks dropped grass and no seed at all, which is the deterministic half of the rule. An honest gap is recorded rather than papered over: an explosion reaches the loot callback with no block at this pin, so the two percent modifier fires only on a player or mob break, and the statistical positive is reported rather than asserted because the harness cannot land hundreds of aimed breaks reliably here."""

