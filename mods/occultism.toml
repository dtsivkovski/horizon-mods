changelog = """Slice 4, the crafting recipes that make an item obtainable for the first time: the dream essence, from datura fruit or from its seeds, now that the crop and its tags exist. Only two of the nineteen recipes whose result the package carries actually qualify, and the table of what was left out is part of the report: the impure chalks need a dust the package does not carry, and the otherstone building family has every ingredient but an unregistered result, so carrying its thirty-eight recipes would ship dead data. Proven in game in a real crafting table: the three-by-three fruit grid makes exactly one essence with the ingredients consumed, the same for seeds, and a mixed five-and-four grid also makes exactly one; nine dirt makes nothing, and the shapeless binding book crafts. This version also fixes a defect of our own, found only in the game: the crop harvest ran once per hand, so one click gave two fruit and six seeds, where the engine reaches the off hand only after the main hand fails. Only the main hand harvests now, and the run reads one fruit and three seeds. Two harness facts are recorded with it: a menu phase needs the offscreen renderer, and a death screen makes every later break answer that the screen is open, which silently cost two runs."""

