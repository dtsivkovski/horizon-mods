changelog = """This version gives the network energizer the menu and the gauge the jar actually has, and the brief was wrong about which block had one: the only menu in the reference belongs to the energizer, so a storage-block menu would have been invented content. Getting the screen to draw took a measurement rather than a reading — opening the menu from the mod's own click gives a menu whose data slots sync but whose screen never appears, because the client builds a mod screen only when the block's own template class opens a menu. So the block is templated on a class that does, chosen for having no state properties of its own so the block's state stays the reference's alone. The gauge carries a number that does not fit a data slot, so it is split into four sixteen-bit limbs, exact for any value, and the leg reads them back as the stored and capacity figures it also prints. One defect in the reference is fixed rather than copied: the energizer reports its capacity as its stored amount, so its bar is always full; this port passes the network's real capacity and the gauge moves, which the leg measures as pixels against the trough."""

