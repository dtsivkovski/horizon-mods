changelog = """Slice 3, the amount on the block's own item: a storage block broken in survival now drops an item carrying its stored energy, and placing that item restores it, clamped to the tier. The payload is built fresh rather than copied from the snapshot, which is what keeps container contents from being carried twice, and the restore is a placement hook because the engine's own path only merges a payload for a vanilla block entity type. Proven in game with the whole round trip and its two counterfactuals: five thousand deposited, broken with a pickaxe into one item whose components name the node and the amount, placed back reading five thousand of two hundred and fifty-six thousand, while a freshly given block reads zero, so the carried amount cannot be the default; a doctored payload naming nearly a billion clamps to the capacity. The 107 carried recipes still craft. Several harness facts are recorded with it, each of which cost a run: the build writes its artifact under the target directory and the port-root copy is the deliverable, a creative placement keeps the stack so the hand must be cleared before a doctored give, a bare-hand break outlasts the default command timeout, and endermen will kill a survival leg unless it runs under resistance."""

