changelog = """Slice 2, the powered furnace multiblock and the seven machine cores. It is the system rather than one machine: the core block, the assembled gate, the core lookup and "a broken core disassembles" are what the foundry, refinery, atomic forge and reactor reuse, and it closes slice 1's gameplay hole — a generator can now drive a machine that turns ore into ingots. From the jar's numbers: 10,000 FE capacity, 256 insert, 32 FE/tick, a 0.5 speed multiplier so a 200-tick recipe finishes in 100, the core at (0,1,0), seven cores with quality equal to tier, an unassembled machine inert, and a broken core freezing progress rather than losing it. The seven carried pulverizer recipes were dead data — they used the 1.21.1 `{"item": …}` form 26.3 rejects — and are rewritten to bare ids by the carry script. Proven in game: no core and ore with 5,000 FE smelts nothing; a core placed by right click assembles at quality 2; 320 FE finishes exactly 10 ticks and an iron ore yields one ingot for exactly 3,200 FE; a core broken mid-smelt freezes progress at 31 with the buffer unspent and a core 4 re-assembles to finish; all seven cores place and read back while machine_core_8 is refused; and all seven pulverizer recipes craft with their inputs consumed.
"""

