changelog = """This version answers a review, and the honest answer is that the delivered version already validated its output before consuming anything — so the work was to make the wrong order inexpressible rather than to fix a bug. The whole decision now lives in one pure rule that answers either a work item or nothing, and the tick only applies what it returns, so a path that takes the input and the fluid before learning the output cannot fit no longer exists. Proven in game on the review's own case and its twin: a full output slot leaves the input, the buffer and the progress untouched for an item recipe, and a full output tank does the same for a fluid recipe, while the same machines with room finish for their exact costs and let the fluid fall by exactly the recipe's amount. The counterfactual removes the fit check and watches exactly those two tests fail. A harness command had to be added, because a machine's output slot has no player route at all — the right click fills inputs and the container reader cannot see a mod block entity."""

