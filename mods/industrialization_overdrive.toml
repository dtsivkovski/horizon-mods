changelog = """
This version answers a review with three fixes, and the first one is the interesting kind: the hatch moved items by the registered stack limit rather than the stack's own, and it ignored whether either write succeeded. Now a read that fails is never taken for an empty slot, the limit comes from the stack's own component when it has one, and a move only counts when both writes report a change, so a refused write rolls the whole tick back instead of leaving one side changed. Proven in game both ways: twelve of a sixteen-limited stack beside eight of the same moves exactly four and keeps four, and a state the boundary refuses consumes nothing on either side. The second fix validates the whole craft result before anything is spent, including a recipe with two distinct results, which this oven's shipped data never produces but a data pack can declare over either the machine's own type or the proxied one, so the guard is proved against an installed pack rather than against a hypothetical. The third removes the inventory diagnostic outright rather than gating it, because operator commands cannot be shown to refuse in this harness, and the vanilla data command prints the same items with their components.
"""
