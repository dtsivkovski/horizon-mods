summary = "Feel an underground Enderman lift you, turn you toward its scream and leave you blinking in another cave."
description = "In multiplayer, install the native cinematic mod on the host and on each client that wants the cinematic. The host identifies the Enderman carrying the player so the client can follow it during the grab. Install the Ender Undertow beta data pack in the world, then opt in with `/trigger eu.scene set 1`. Add Ender Undertow Resources for voices and wardrobe, and Ender Undertow Focus for blur and warble. This native beta targets Horizon 26.3 Nightly 2026-11-20.\n\n**Installing Ender Undertow on Horizon 26.3**\n\n- [Ender Undertow](https://playhorizon.dev/mods/ender_undertow) — World data pack for the mining and teleport encounter. It works on its own.\n- **Cinematic** (this listing) — Native mod for the camera turn, lowered hands and color fade. Install on the host and each participating client, then opt in with `/trigger eu.scene set 1`.\n- [Resources](https://playhorizon.dev/mods/ender_undertow_resources) — Client resource pack for the Gentleman’s voice and wardrobe and the lingering portal sound. Enable it in Resource Packs.\n- [Focus](https://playhorizon.dev/mods/ender_undertow_focus) — Optional client shader for blur and warble during the cinematic. Select it in Shader Packs.\n\n[Download all four in one ZIP and see installation instructions](https://michado.dk/projects/ender-undertow/#install)."
