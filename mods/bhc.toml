changelog = """Slice 4, the melted-heart chain: the items and recipes that turn a dropped heart into a permanent one, which is the mod's actual reward loop. Everything is vanilla data — four plain items, smelting and shaped and shapeless recipes, one tag — so no Rust rule changed and the smelting is served by the engine's own lookup. Verified in game from both sides rather than one: a heart enters the furnace and the read a little later still shows one in and none out, then the pair flips to none in and one out, with the same shape at each of the four cooking times, plus a stick in a lit furnace as the control that must produce nothing. The table legs use a different colour in the recipe's centre, which is what proves the hearts tag rather than one specific heart, and the six tier conversions run both ways with two negatives that consume their grid and yield nothing. Two of our brief's numbers were wrong and the artefact corrected them: the cooking times are a hundred through four hundred ticks rather than a single figure, and there are six conversions rather than three, so carrying three would have invented a one-way chain. One engine fact is recorded with it: the older object-shaped ingredients are dropped silently by the loader, so every carried recipe uses the plain string form."""

