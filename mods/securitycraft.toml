changelog = """Slice 4, the owner gate on setting a code: a keypad's code can now only be set by the player who owns it, at the moment the set screen would open and again when the code is submitted, which is the reference's two checks rather than one. Proven in game with the three refusals and their reasons: a stranger's right click opens no screen at all, a stranger's submit stores nothing, and a stranger's command answers that only the owner may set the code, while the owner's submit sets it and the check reads back. A keypad with no owner matches nobody, which is recorded rather than guessed. The testing needed a harness-only command that puts a stranger's identity in front of the block, because a single-player run has only one player; that command is op-gated and exists only for the leg. This version also carries the lock file its declared dependency needs, and its own clean build compiles from the archive."""

