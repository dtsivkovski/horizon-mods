sha256 = "68b1485efc1539b665aeb623e986d042bb73626723bc3d9cd4c6b1d3124c88b8"
changelog = """This version gives the pipe and the surge the water state their reference declares, so a water bucket fills a dry one and an empty bucket drains a filled one without breaking the network. The proof keeps the machine working through the state change: a fresh pipe reads unwaterlogged, a bucket makes it waterlogged and leaves an empty bucket in hand, the waterlogged pipe still pulls a machine's souls into its own store, and an empty bucket returns it to dry with the water handed back. The surge reads both of its properties at once and still spends a soul. Two things the pin cannot do are recorded rather than faked: a content block's interfaces are its template's, so the reference's waterlogged interface does not exist to copy, and flowing water or a dispenser does not fill these blocks. One measurement changed a decision: this build reverts a water bucket written into the held slot from a click, so a drained bucket goes to the first free slot that is not the hand and a full inventory refuses the drain instead of losing the water.
"""

[[versions]]
version = "0.2.2"
published = "2026-11-23"
game = "26.3"
file = "industrialforegoingsouls.hmod"
sha256 = "7397e359a64ddb7b34f46e870ae8a8dc7c60ec2da15145b0a9dc735a50fb0e16"
changelog = """This version answers a review. The package now declares the parent it binds to, with the reason and the link, and the proof is a refusal rather than an assurance: installed alone, the loader stops before compiling anything and names both mods, repeating the declaration's own reason and address; installed with the parent, both packages compile and the machine leg passes. Three behaviour defects are fixed with them. The pipe network was walked in full by every pipe every tick, with a linear membership test at each neighbour, so a large network cost work that grew faster than it; it is now set-based, walked once per tick per component, cached for the tick and bounded. A second lens no longer consumes the new item and voids the seated one: the swap reserves a destination first and refuses the click when there is none, because a full inventory is not permission to destroy one. And a broken machine now carries its lens and its augment on its own item and restores them, while an empty machine's item carries nothing. The original notice is the upstream text verbatim, including the second copyright holder our first archive had dropped.
"""
