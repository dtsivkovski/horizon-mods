changelog = """Slice 3, the solar boilers: a bronze and a steel boiler that turn water into steam only in daylight with a clear view of the sky, and that calcify as they work, losing efficiency until a wrench scrapes them clean. The steam question was the point of this slice and it is answered by measurement rather than assumption: the campaign's own parent port models steam as energy and registers no steam fluid, and a package may only declare a fluid in its own namespace, but the engine does offer a tank-only fluid declaration, so the boiler declares its own steam, fills a real tank with it, and a pipe drains it. That also corrects an earlier claim in this port that distilled water was blocked for want of a fluid registry. Proven in game with the ratio and the sky rule: sixteen millibuckets of steam per millibucket of water, four a tick at noon, three hundred and twenty drained back out by a pipe, the tank frozen for forty ticks when a block is placed above and running again when it is removed, and calcification at fifty percent halving the rate until an iron axe resets it. Two defects only the game found are recorded: one part type attached as both the block and the block-entity part makes the engine refuse the package, and this data set spells the axe tag differently from the loader's convention, so both spellings are accepted."""

[[versions]]
version = "0.1.1"
published = "2026-11-21"
game = "26.3"
file = "extended_industrialization.hmod"
sha256 = "62ddf14ab9faae1f89a0d6f9eb5159863569d7d0e3ebbe1c6522b1db62e8a9e4"
changelog = """Slice 2, the solar panels: three tiers that make the mod's first energy source, and the photovoltaic cell that sets the rate. The sky read exists at this pin, so the panel genuinely needs to see the sun: proven in game by blocking the sky above it and watching the buffer freeze where it had been climbing, and by setting midnight and watching the rate fall to nothing. The numbers are the cell's own: an LV panel makes three hundred and twenty FE a tick into a twelve-thousand cell and rises sixteen thousand over fifty ticks, an MV makes twelve hundred and eighty, an HV five thousand one hundred and twenty, each into its own bigger buffer, and a cell of the wrong tier simply does not match. Energy is lost only from the down face, which is the panel's own rule, and each panel breaks into its own item while its buffer and cell wear survive a relaunch. Distilled water's bonus rate and doubled cell life are unit-tested and recorded as blocked rather than faked, because the pin has no fluid registry to read that fluid from. The filling recipe from the previous slice is re-asserted, and its selftest still fails as it must."""

